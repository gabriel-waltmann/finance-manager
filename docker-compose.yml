services:
  db:
    image: postgres:16
    container_name: finance-manager-db
    restart: always
    environment:
      POSTGRES_PASSWORD: finance-manager-password-123
      POSTGRES_USER: finance-manager-user
      POSTGRES_DB: finance-manager-db
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data

  redis:
    image: redis:8.8-alpine
    container_name: finance-manager-redis
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    restart: unless-stopped


volumes:
  db:
  redis:
