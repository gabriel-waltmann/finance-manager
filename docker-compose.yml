services:
  db:
    image: postgres:16
    container_name: finance-manager-db
    restart: always
    environment:
      POSTGRES_PASSWORD: finance-manager-password-123
      POSTGRES_USER: finance-manager-user
      POSTGRES_DB: finance-manager-db
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data

  redis:
    image: redis:8.8-alpine
    container_name: finance-manager-redis
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: finance-manager-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: finance-manager-rabbitmq-password-123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
    restart: unless-stopped

volumes:
  db:
  redis:
  rabbitmq_data:
  rabbitmq_log:
